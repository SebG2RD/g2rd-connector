name: SBOM — Inventaire des dépendances

# Génère et publie un SBOM CycloneDX (Composer + npm) à chaque release publiée.
# Adapté du workflow homonyme du G2RD-theme.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release cible (ex. v0.1.0) — vide = HEAD'
        required: false
        type: string

permissions:
  contents: write      # attacher le SBOM à la release
  id-token: write      # attestation sigstore
  attestations: write  # créer l'attestation GitHub

jobs:
  sbom:
    name: Générer et publier le SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Composer install (prod)
        # Le plugin n'a pas de dépendances Composer runtime, mais on installe
        # quand même (no-dev) pour que Syft inventorie composer.json/lock.
        run: composer install --no-interaction --prefer-dist --no-dev || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances npm
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts --no-audit --no-fund; fi

      - name: Générer le SBOM (CycloneDX JSON)
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          artifact-name: g2rd-connector-sbom.cdx.json
          output-file: g2rd-connector-sbom.cdx.json
          upload-release-assets: ${{ github.event_name == 'release' }}

      - name: Attester le SBOM (GitHub Artifact Attestation)
        uses: actions/attest-sbom@v2
        continue-on-error: true
        with:
          subject-path: g2rd-connector-sbom.cdx.json
          sbom-path: g2rd-connector-sbom.cdx.json

      - name: Uploader le SBOM comme artifact de workflow
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: g2rd-connector-sbom.cdx.json
          retention-days: 90

      - name: Attacher le SBOM à la release (workflow_dispatch avec tag)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: g2rd-connector-sbom.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
