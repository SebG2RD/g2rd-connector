version: 2
updates:
  # Même politique que le manager : les MAJ mineures/patch sont regroupées pour
  # éviter l'empilement de PR, les MAJ MAJEURES restent en PR individuelles (à
  # revoir au cas par cas, car potentiellement cassantes — une major mergée sans
  # relecture a déjà cassé `npm ci` côté manager).
  #
  # Les dépendances vivent à la racine de ce dépôt (composer.json, package.json),
  # pas dans des sous-dossiers comme côté manager.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      dev-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Épinglée sur la copie que WordPress livre au parc (1.24.0 dans WordPress 6.9
      # à 7.1.3) : les cas « compat » des tests doivent voir le même code que les
      # sites. Sa version suit WordPress, pas Packagist ; une montée ferait échouer
      # tests/Backup/Crypto/SodiumCompatCopieTest.php et tout le groupe avec elle.
      # Aucune alerte ne viendra donc d'ici : la montée se décide par le relevé à
      # refaire à chaque version majeure ou mineure de WordPress sur le parc (règle
      # écrite dans le docblock de ce test).
      - dependency-name: paragonie/sodium_compat

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ['*']
